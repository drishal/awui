# awui settings: copy to ~/.config/awui/config.yml.
# Every key is optional. Restart the server after changing port, host, auth,
# or the lists (systemctl --user restart awui); theme, text_scale, chat_width,
# density, tool_style, font, autocollapse_sidebar, and herdr apply on the next page load, and orchestration
# every couple of seconds. Environment
# variables (PORT, HOST, AUTH_USERNAME, ...) win over this file.

# Port for the UI and API (1024-65535).
port: 4783

# 127.0.0.1: this machine only, no sign-in.
# 0.0.0.0:   also on the LAN (open the port in the firewall); other devices sign in.
host: 127.0.0.1

# Login for other devices: needed for host 0.0.0.0 or allowed_hosts, ignored
# otherwise; this machine never signs in.
# Changing it signs every device out. The file is kept at mode 0600, and the
# password never reaches the agents' environment. To keep only a hash on
# disk instead, leave password out and run `npm run set-password`.
auth:
  username: you
  password: ""

# Folders projects may be opened from (default: your home directory).
# workspace_roots: [~/code, ~/dotfiles]

# Extra Host names to accept, e.g. your Tailscale Serve name.
# allowed_hosts: [machine.tailnet.ts.net]
# Optional: Serve requests must also come from one of these Tailscale logins.
# allowed_tailscale_users: [you@example.com]

# The shared look on every device: theme is system (follow light/dark),
# light, dark, or base16 (theme.yml in this folder: a base16/base24 scheme).
# text_scale sizes the conversation (1 = 100%); chat_width sets how wide it
# runs: comfortable (960 px), wide (1400 px), or full (the whole pane);
# density is comfortable or compact (tighter sidebar rows, turns, tool rows,
# composer, and tab strip; phones keep their touch sizes); tool_style is cards
# (a run's calls grouped as one card) or lines (the flat list older versions drew);
# font is bundled (Inter and JetBrains Mono, shipped with awui, the same on every
# device) or system (each device's own fonts).
theme: system
# text_scale: 1.1
# chat_width: wide
# density: compact
# tool_style: lines
# font: system

# Fold the sidebar away in narrow windows (below 1200 px; phones use the
# drawer anyway). A sidebar you collapsed yourself stays collapsed.
autocollapse_sidebar: true

# The bar under the conversation: connection, harness, model, folder, and
# version. false hides it (phones hide it anyway).
show_status_bar: true

# The desktop app: closing its window hides it to the tray, so finished runs
# and approvals still notify you; quit from the tray or with Ctrl+Q. false
# makes closing the window quit the app. Read each time the window closes.
desktop_background: true

# Work with herdr (herdr.dev) when it runs: mark the sessions open in its
# panes, and let atui in a herdr pane report its chats there. Applies on the
# next page load (atui on its next start).
herdr: true
# herdr's API socket, for a named herdr session (read at startup; the default
# session's is found by itself).
# herdr_socket: ~/.config/herdr/sessions/work/herdr.sock

# Which changed files a worktree or race card counts as tests and as generated
# output, for its Source / Tests / Generated chip. Globs; `**` crosses folders
# and a trailing `/` means everything under that folder. Anything matching
# neither list is the project's own code. The defaults are listed here commented
# out; uncomment a list to replace it, not to add to it.
# breakdown:
#   tests: ["**/*.test.*", "**/*.spec.*", "**/*_test.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/spec/**", "**/*.snap"]
#   generated: ["**/*.min.*", "**/*.gen.*", "**/*.generated.*", "**/dist/**", "**/build/**", "**/out/**", "**/vendor/**", "**/node_modules/**", "**/*-lock.json", "**/*.lock", "**/package-lock.json", "**/pnpm-lock.yaml", "**/yarn.lock", "**/Cargo.lock", "**/go.sum"]

# Agents delegating work to other agents: a chat's agent can hand a task to
# another agent chat, watch it, stop it, and read the result back. Read again
# every couple of seconds, so a change needs no restart; the Settings dialog
# shows only the on/off switch. docs/orchestration.md says what each one does.
# orchestration:
#   enabled: true            # false: no agent is given the tools at all
#   maxChildrenPerChat: 4    # tasks one chat may run at once
#   maxTasksPerChat: 32      # tasks one chat may ever start
#   maxLiveTasks: 12         # tasks this server runs at once
#   maxDepth: 2              # 2 lets a child delegate once, and stops at grandchildren
#   taskWallClockMs: 2700000 # 45 min: a task still working is stopped and failed
#   wakeParents: true        # wake the parent's agent with a finished child's result
#   maxWakesPerHour: 20      # wake prompts one parent may receive in an hour
#   callsPerMinute: 60       # tool calls one chat may make in a minute

# Claude Code's own settings awui passes on (read at startup; no Settings dialog
# field). subagent_prompt_cache_ttl gives a chat another agent delegated the
# prompt cache lifetime Claude Code gives its own subagents: 5m or 1h. Unset, a
# delegated child keeps the main conversation's lifetime, as Claude Code does.
# entrypoint names awui to Claude Code (CLAUDE_CODE_ENTRYPOINT). Unset, awui
# removes the variable and the CLI labels the chat sdk-cli. Claude Code's own
# labels (cli, sdk-*, claude-vscode, claude-desktop, claude-code) are refused.
# Anthropic has not said whether a custom name is allowed
# (github.com/anthropics/claude-code/issues/97074), so this stays off until you
# turn it on, at your own risk.
# claude:
#   subagent_prompt_cache_ttl: 1h
#   entrypoint: awui

# How each harness's CLI starts (read at startup; the Settings dialog does not
# show this, since a command is a program the server runs). command: its
# executable instead of the name on PATH. args: added to every chat's command
# line (not Hermes's, whose chats run its gateway; never the Awui harness's).
# PI_BIN, OMP_BIN, HERMES_BIN, CLAUDE_BIN, CODEX_BIN, OPENCODE_BIN, GROK_BIN, and DSH_BIN win over command.
# OpenCode takes no args either: its chats share one `opencode serve`. Grok takes
# both command and args; its args go before the mode name `stdio`, Codex's after
# `app-server`, and DSH's after `--profile acp`.
# harnesses:
#   pi:
#     command: ~/code/pi/bin/pi
#   claude:
#     args: [--add-dir, /srv/docs]   # passed as they are: no shell, so no ~
#     # --allow-dangerously-skip-permissions also offers Bypass (asks nothing) in the permission picker
#   codex:                                 # chats run `codex app-server`
#     command: ~/code/codex/bin/codex
#   grok:
#     command: ~/code/grok/bin/grok
#   dsh:                                  # chats run `dsh --profile acp`
#     command: ~/code/deepseek-harness/bin/dsh
#     # Install the ACP profile's bundle once, pinned to your dsh version:
#     #   dsh plugin --profile acp add @deepseek-ai/dsh-acp-app@<version>
#
# Any other Agent Client Protocol agent: one entry per app, each a harness of its
# own (see docs/harnesses.md, "Any ACP agent from config"). Up to 16; the id is a
# lowercase slug and may not be one of the built-in harness ids. env values are
# handed to the child and never read back to a browser; auth_method is the id the
# agent advertises, not a secret.
#   acp:
#     - id: gemini
#       name: Gemini CLI
#       command: gemini                # ~/ is expanded
#       args: [--acp]
#       # env:
#       #   GEMINI_API_KEY: ...
#       # auth_method: oauth-personal
#     - id: goose
#       command: goose
#       args: [acp]
